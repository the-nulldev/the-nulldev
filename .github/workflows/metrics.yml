name: Refresh profile cards

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/metrics.yml'
      - 'README.md'
      - 'package.json'
      - 'scripts/metrics/**'

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Generate profile cards
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN || github.token }}
        run: npm run generate

      - name: Commit updated cards
        run: |
          if test -z "$(git status --porcelain -- metrics)"; then
            echo 'Profile cards are already up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add metrics/
          git commit -m 'Update profile cards'
          git push
