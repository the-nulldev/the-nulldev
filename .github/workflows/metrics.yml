name: Refresh profile metrics

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/metrics.yml"
      - "README.md"

permissions:
  contents: write

concurrency:
  group: profile-metrics
  cancel-in-progress: false

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Remove retired metric cards
        run: |
          rm -f metrics/projects.svg metrics/achievements.svg metrics/habits.svg metrics/licenses.svg
          git add -A -- metrics/projects.svg metrics/achievements.svg metrics/habits.svg metrics/licenses.svg
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Remove retired metric cards"
            git push
          else
            echo "No retired metric cards to remove."
          fi

      - name: Recent activity
        uses: lowlighter/metrics@latest
        with:
          token: ${{ github.token }}
          committer_token: ${{ github.token }}
          user: the-nulldev
          filename: metrics/activity.svg
          base: ""
          output_action: commit
          config_timezone: UTC
          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 14
          plugin_activity_visibility: public

      - name: Languages activity
        uses: lowlighter/metrics@latest
        with:
          token: ${{ github.token }}
          committer_token: ${{ github.token }}
          user: the-nulldev
          filename: metrics/languages.svg
          base: ""
          output_action: commit
          config_timezone: UTC
          plugin_languages: yes
          plugin_languages_sections: most-used, recently-used
          plugin_languages_limit: 6
          plugin_languages_recent_load: 300
          plugin_languages_recent_days: 14

      - name: Star-list repositories and languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ github.token }}
          committer_token: ${{ github.token }}
          user: the-nulldev
          filename: metrics/starlists.svg
          base: ""
          output_action: commit
          config_timezone: UTC
          plugin_starlists: yes
          plugin_starlists_limit: 5
          plugin_starlists_limit_repositories: 5
          plugin_starlists_languages: yes
          plugin_starlists_limit_languages: 5

      - name: Featured repositories
        uses: lowlighter/metrics@latest
        with:
          token: ${{ github.token }}
          committer_token: ${{ github.token }}
          user: the-nulldev
          filename: metrics/featured.svg
          base: ""
          output_action: commit
          config_timezone: UTC
          plugin_repositories: yes
          plugin_repositories_pinned: 4

      - name: Starred topics with icons
        uses: lowlighter/metrics@latest
        with:
          token: ${{ github.token }}
          committer_token: ${{ github.token }}
          user: the-nulldev
          filename: metrics/topics-icons.svg
          base: ""
          output_action: commit
          config_timezone: UTC
          plugin_topics: yes
          plugin_topics_mode: icons
          plugin_topics_limit: 12

      - name: Starred topics with labels
        uses: lowlighter/metrics@latest
        with:
          token: ${{ github.token }}
          committer_token: ${{ github.token }}
          user: the-nulldev
          filename: metrics/topics-labels.svg
          base: ""
          output_action: commit
          config_timezone: UTC
          plugin_topics: yes
          plugin_topics_mode: labels
          plugin_topics_limit: 12

      - name: LeetCode
        uses: lowlighter/metrics@latest
        with:
          token: ${{ github.token }}
          committer_token: ${{ github.token }}
          user: the-nulldev
          filename: metrics/leetcode.svg
          base: ""
          output_action: commit
          config_timezone: UTC
          plugin_leetcode: yes
          plugin_leetcode_user: the-null-dev
          plugin_leetcode_sections: solved, skills, recent

      - name: Profile repository overview
        uses: lowlighter/metrics@latest
        with:
          token: ${{ github.token }}
          committer_token: ${{ github.token }}
          user: the-nulldev
          repo: ${{ github.repository }}
          filename: metrics/repository.svg
          template: repository
          base: repositories
          output_action: commit
          config_timezone: UTC